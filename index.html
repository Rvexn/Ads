<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Multi-Ad Player</title>
    
    <style>
        :root { --primary: #00ff88; --dark: #0a0a0a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; text-align: center; margin: 0; padding: 20px; }
        .card { background: #161616; max-width: 450px; margin: 30px auto; padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,255,136,0.1); }
        .timer { font-size: 60px; color: var(--primary); font-weight: 800; margin: 20px 0; }
        .btn { background: var(--primary); color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .hidden { display: none; }
        .badge { background: #333; padding: 5px 15px; border-radius: 50px; font-size: 12px; color: var(--primary); margin-bottom: 15px; display: inline-block; }
        .warning-text { color: #ff4444; font-size: 13px; margin-top: 15px; font-weight: bold; background: rgba(255, 68, 68, 0.1); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="maker" class="card">
    <h2>🔗 Link Maker</h2>
    <p style="color:#888; font-size: 14px;">Yahan link banayein, ads yahan nahi dikhenge.</p>
    <input type="text" id="longUrl" placeholder="Paste destination link here">
    <select id="adSteps" style="width:100%; padding:10px; border-radius:8px; margin-bottom:10px; background: #222; color: white;">
        <option value="1">1 Step (15s)</option>
        <option value="2">2 Steps (30s)</option>
    </select>
    <button class="btn" onclick="generate()">Create Ad-Link</button>
    <div id="out" class="hidden">
        <input type="text" id="res" readonly style="border:1px solid var(--primary); margin-top:10px;">
        <button class="btn" style="background:#fff;" onclick="copy()">Copy Link</button>
    </div>
</div>

<div id="player" class="card hidden">
    <div id="ad-container-top"></div> <div class="badge" id="stepInfo">Step 1 of X</div>
    <h3>Verification Required ❌</h3>
    <p style="color:#aaa; font-size:14px;">Open this link to verify identity.</p>
    
    <button id="adBtn" class="btn" onclick="playRandomAd()">🔞 Open Full Video 🔞</button>

    <div id="timerSection" class="hidden">
        <div class="timer" id="clock">15</div>
        <div class="warning-text">
            ⚠️ SYSTEM LOCKED: Leaving or Back is disabled!
        </div>
    </div>

    <button id="nextBtn" class="btn hidden" style="background:#fff;" onclick="handleNext()">Final Video ➔</button>

    <div id="native-ad-area" style="margin-top: 20px;"></div>
</div>

<script>
    let cur = 1, total = 1, finalDest = "", isTimerRunning = false;
    const adsList = ["https://www.effectivegatecpm.com/ese22rset?key=0bdd4b7fc8c9324f4ec7f161bce720ed"];

    // Function to load Ads only when player starts
    function injectAds() {
        // Popunder
        let pop = document.createElement('script');
        pop.src = "https://pl28638298.effectivegatecpm.com/a7/a6/fb/a7a6fb04ad8a0503f20da9aa4e4ecc90.js";
        document.head.appendChild(pop);

        // Social Bar
        let sb = document.createElement('script');
        sb.src = "https://pl28622374.effectivegatecpm.com/dc/da/86/dcda86c6b4d0fcb50d4bc9138245046b.js";
        document.head.appendChild(sb);

        // Native Banner (Iframe format)
        document.getElementById('native-ad-area').innerHTML = `
            <script type="text/javascript">
                atOptions = { 'key' : '84793a11e4daa94841fba1d1072d4285', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
            <\/script>
            <script src="https://www.highperformanceformat.com/84793a11e4daa94841fba1d1072d4285/invoke.js"><\/script>
        `;
    }

    // --- LOCK SYSTEM ---
    function lockUser() {
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            if (isTimerRunning) {
                history.go(1);
                alert("❌ STAY ON PAGE: 15s Verification is compulsory!");
            }
        };
    }

    window.onbeforeunload = function() {
        if (isTimerRunning) return "Don't leave! Verification in progress.";
    };

    function generate() {
        let u = document.getElementById('longUrl').value;
        if(!u) return alert("Link enter karein!");
        let s = document.getElementById('adSteps').value;
        document.getElementById('res').value = window.location.href.split('?')[0] + "?u=" + btoa(u) + "&s=" + s;
        document.getElementById('out').classList.remove('hidden');
    }

    window.onload = function() {
        let p = new URLSearchParams(window.location.search);
        if(p.has('u')) {
            document.getElementById('maker').classList.add('hidden');
            document.getElementById('player').classList.remove('hidden');
            finalDest = atob(p.get('u'));
            total = parseInt(p.get('s'));
            document.getElementById('stepInfo').innerText = `Step ${cur} of ${total}`;
            
            // Yahan Ads inject honge sirf User/Player screen par
            injectAds(); 
        }
    }

    function playRandomAd() {
        window.open(adsList[0], '_blank');
        document.getElementById('adBtn').classList.add('hidden');
        document.getElementById('timerSection').classList.remove('hidden');
        
        isTimerRunning = true; 
        lockUser();

        let time = 15; 
        let timer = setInterval(() => {
            time--;
            document.getElementById('clock').innerText = time;
            if(time <= 0) {
                clearInterval(timer);
                isTimerRunning = false; 
                document.getElementById('timerSection').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
            }
        }, 1000);
    }

    function handleNext() {
        if(cur < total) {
            cur++;
            document.getElementById('stepInfo').innerText = `Step ${cur} of ${total}`;
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('adBtn').classList.remove('hidden');
            document.getElementById('clock').innerText = "15";
        } else {
            isTimerRunning = false; 
            window.onbeforeunload = null;
            window.location.href = finalDest;
        }
    }

    function copy() {
        let r = document.getElementById('res'); r.select(); document.execCommand('copy'); alert("Link Copied!");
    }
</script>

</body>
</html>
