<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Multi-Ad Player</title>

    <script>
        var isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        var isFacebook = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1);
        var isWhatsApp = (ua.indexOf("WhatsApp") > -1);

        if (!isChrome || isFacebook || isWhatsApp) {
            window.stop();
            document.documentElement.innerHTML = `
                <body style="margin:0; padding:0; display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; font-family:sans-serif; background:#fff;">
                    <div style="padding:20px;">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg" width="80" style="margin-bottom:20px;">
                        <h1 style="font-size:22px; color:#202124;">Open with Google Chrome</h1>
                        <p style="color:#5f6368;">Behtar experience ke liye niche button par click karke Chrome mein kholiye.</p>
                        <a href="intent://${window.location.host}${window.location.pathname}${window.location.search}#Intent;scheme=https;package=com.android.chrome;end" 
                           style="background:#1a73e8; color:white; padding:15px 35px; border-radius:50px; text-decoration:none; font-weight:bold; display:inline-block; margin-top:20px;">
                           OPEN IN CHROME APP
                        </a>
                    </div>
                </body>`;
        }
    </script>

    <script src="https://pl28622374.effectivegatecpm.com/dc/da/86/dcda86c6b4d0fcb50d4bc9138245046b.js"></script>

    <style>
        :root { --primary: #00ff88; --dark: #0a0a0a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; text-align: center; margin: 0; padding: 20px; }
        .card { background: #161616; max-width: 450px; margin: 30px auto; padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,255,136,0.1); }
        .timer { font-size: 60px; color: var(--primary); font-weight: 800; margin: 20px 0; }
        .btn { background: var(--primary); color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn:disabled { background: #222; color: #555; cursor: not-allowed; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .hidden { display: none; }
        .badge { background: #333; padding: 5px 15px; border-radius: 50px; font-size: 12px; color: var(--primary); margin-bottom: 15px; display: inline-block; }
    </style>
</head>
<body>

<div id="maker" class="card">
    <h2>🔗 Permanent Link Maker</h2>
    <input type="text" id="longUrl" placeholder="https://your-destination-link.com">
    <select id="adSteps">
        <option value="1">1 Ad Step (30s)</option>
        <option value="2">2 Ad Steps (60s)</option>
        <option value="3">3 Ad Steps (90s)</option>
    </select>
    <button class="btn" onclick="generate()">Create Ad-Link</button>
    <div id="out" class="hidden">
        <p style="font-size:12px; color:#888; margin-top:15px;">Ise copy karke kahin bhi share karein:</p>
        <input type="text" id="res" readonly style="border:1px solid var(--primary);">
        <button class="btn" style="background:#fff;" onclick="copy()">Copy Link</button>
    </div>
</div>

<div id="player" class="card hidden">
    <div class="badge" id="stepInfo">Step 1 of X</div>
    <h3>Verify to Human ❌</h3>
    <p style="color:#aaa; font-size:14px;"> Open this link 📥..Only 18+ members </p>
    
    <button id="adBtn" class="btn" onclick="playRandomAd()">🔞 Open Full Video 🔞 </button>

    <div id="timerSection" class="hidden">
        <div class="timer" id="clock">30</div>
        <p>Please Wait ......</p>
    </div>

    <button id="nextBtn" class="btn hidden" style="background:#fff;" onclick="handleNext()">Next Step ➔</button>
</div>

<script>
    let cur = 1, total = 1, finalDest = "";
    
    const adsList = [
        "https://www.effectivegatecpm.com/ese22rset?key=0bdd4b7fc8c9324f4ec7f161bce720ed"
    ];

    function generate() {
        let u = document.getElementById('longUrl').value;
        if(!u) return alert("Link enter karein!");
        let s = document.getElementById('adSteps').value;
        let short = window.location.href.split('?')[0] + "?u=" + btoa(u) + "&s=" + s;
        document.getElementById('res').value = short;
        document.getElementById('out').classList.remove('hidden');
    }

    window.onload = function() {
        let p = new URLSearchParams(window.location.search);
        if(p.has('u')) {
            document.getElementById('maker').classList.add('hidden');
            document.getElementById('player').classList.remove('hidden');
            finalDest = atob(p.get('u'));
            total = parseInt(p.get('s'));
            document.getElementById('stepInfo').innerText = `Step ${cur} of ${total}`;
        }
    }

    function playRandomAd() {
        let randomAd = adsList[Math.floor(Math.random() * adsList.length)];
        window.open(randomAd, '_blank');

        document.getElementById('adBtn').classList.add('hidden');
        document.getElementById('timerSection').classList.remove('hidden');

        let time = 30;
        let timer = setInterval(() => {
            time--;
            document.getElementById('clock').innerText = time;
            if(time <= 0) {
                clearInterval(timer);
                document.getElementById('timerSection').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
                if(cur == total) document.getElementById('nextBtn').innerText = "Unlock Video Link";
            }
        }, 1000);
    }

    function handleNext() {
        if(cur < total) {
            cur++;
            document.getElementById('stepInfo').innerText = `Step ${cur} of ${total}`;
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('adBtn').classList.remove('hidden');
            document.getElementById('clock').innerText = "30";
        } else {
            window.location.href = finalDest;
        }
    }

    function copy() {
        let r = document.getElementById('res'); r.select(); document.execCommand('copy'); alert("Link Copied!");
    }
</script>

</body>
</html>
